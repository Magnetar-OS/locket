[package]
name = "locket-daemon"
description = "locket session daemon: holds the unlocked vault, serves D-Bus and the SSH agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Not published: a session daemon whose correct installation is the
# systemd user unit and D-Bus service file the distro package places.
# A stray `cargo install` copy shadowing the packaged one is a support
# problem nobody needs from a process that holds the vault key.
publish = false

[[bin]]
name = "locketd"
path = "src/main.rs"

[features]
# Passes through to locket-agent: serve `sk-` SSH keys from a security key.
default = ["fido"]
fido = ["locket-agent/fido"]

[dependencies]
locket-core.workspace = true
locket-secret.workspace = true
locket-agent.workspace = true
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
uuid.workspace = true
# For the process hardening at startup: mlockall and PR_SET_DUMPABLE.
libc = "0.2"
clap.workspace = true
dirs.workspace = true
rpassword = "7"
