[package]
name = "locket-nmh"
description = "Native messaging host: lets a browser extension reach the locket vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Not published: the native messaging host is only reachable once its
# manifest is registered with a browser, which the distro package does.
# `cargo install` would leave a binary no browser can find.
publish = false

[[bin]]
name = "locket-native-host"
path = "src/main.rs"

[dependencies]
locket-secret.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zbus.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
