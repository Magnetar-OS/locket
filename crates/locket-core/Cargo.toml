[package]
name = "locket-core"
description = "Vault format, cryptography and item model for locket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
zeroize.workspace = true
subtle.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
base32.workspace = true
base64ct.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true
dirs.workspace = true
zxcvbn = { workspace = true, optional = true }

[features]
default = ["health"]
# The password-health report (strength estimation via zxcvbn). Off, the
# `health` module disappears and the crate stays crypto-lean for consumers
# like the PAM module's tree that will never show a report.
health = ["dep:zxcvbn"]

[dev-dependencies]
tempfile = "3"
