[package]
name = "locket-applet"
description = "COSMIC panel applet showing locket's lock state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Not publishable: same libcosmic git dependency as locket-cosmic.
# Ships as a distro package.
publish = false

[[bin]]
name = "locket-applet"
path = "src/main.rs"

[dependencies]
# For `SecretString`: the copy of a secret kept for clearing the clipboard.
locket-core.workspace = true
locket-secret.workspace = true
tokio.workspace = true
tracing.workspace = true
zbus.workspace = true
# Opens the main window as its own unit of the user's systemd session, so
# restarting the panel does not take the vault window down with it.
# libcosmic's launcher crate, from the same repository and so the same locked
# revision.
cosmic-launch = { git = "https://github.com/pop-os/libcosmic" }
tracing-subscriber.workspace = true

# --- localization ---
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.13"

[dependencies.libcosmic]
# Unpinned for the reasons in `locket-cosmic/Cargo.toml`; `Cargo.lock` holds
# the commit both crates share.
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "applet",
    # Ask the compositor for an XDG activation token before launching the main
    # window. Without one the window comes up unfocused behind the panel, and
    # a running instance cannot be raised at all.
    "applet-token",
    "tokio",
    "wayland",
    "a11y",
]
