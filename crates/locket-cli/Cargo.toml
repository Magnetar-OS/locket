[package]
name = "locket-cli"
description = "Command line interface for locket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["password", "vault", "cli", "secrets", "keyring"]
categories = ["command-line-utilities", "authentication"]
readme = "README.md"

[[bin]]
name = "locket-cli"
path = "src/main.rs"

[features]
# Opening the vault with a hardware factor. Optional at build time for the
# same reason as in the application: tss-esapi needs libtss2 and
# ctap-hid-fido2 needs hidapi.
default = ["tpm", "fido"]
tpm = ["dep:locket-tpm"]
fido = ["dep:locket-fido"]

[dependencies]
locket-core.workspace = true
locket-tpm = { workspace = true, optional = true }
locket-fido = { workspace = true, optional = true }
locket-hibp.workspace = true
locket-secret.workspace = true
locket-import.workspace = true
tokio.workspace = true
zbus.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
uuid.workspace = true
rpassword = "7"

[dev-dependencies]
tempfile = "3"
# A private bus with a daemon's objects on it; see locket_secret::testing.
locket-secret = { workspace = true, features = ["test-bus"] }
# A software TPM per test; see locket_tpm::testing.
locket-tpm = { workspace = true, features = ["test-swtpm"] }
