[workspace]
resolver = "3"
# Its own workspace: libfuzzer's build flags and lockfile stay out of ours.
exclude = ["fuzz"]
members = [
    "crates/locket-core",
    "crates/locket-hibp",
    "crates/locket-secret",
    "crates/locket-agent",
    "crates/locket-daemon",
    "crates/locket-cli",
    "crates/locket-cosmic",
    "crates/locket-applet",
    "crates/locket-tpm",
    "crates/locket-fido",
    "crates/locket-import",
    "crates/locket-ipc",
    "crates/locket-pam",
    "crates/locket-nmh",
]

[workspace.package]
version = "2.1.1"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/Magnetar-OS/locket"
authors = ["Dominikos Pritis <dominikos.pritis@gmail.com>"]

[workspace.dependencies]
# Every inter-crate dependency lives here, and every one carries a
# `version` next to its `path`. cargo rewrites the path away when packaging
# and publishes the version instead, so a member without one cannot be
# published at all. Declaring them once means the number that goes to
# crates.io is edited in a single place at release time.
locket-core = { path = "crates/locket-core", version = "2.1.1" }
locket-ipc = { path = "crates/locket-ipc", version = "2.1.1" }
locket-hibp = { path = "crates/locket-hibp", version = "2.1.1" }
locket-secret = { path = "crates/locket-secret", version = "2.1.1" }
locket-import = { path = "crates/locket-import", version = "2.1.1" }
# `default-features = false`: locket-daemon is the only consumer and it
# re-exports the `fido` feature under its own name, so the default is off
# here and opted into there. When this was written a member could not turn
# off an inherited default at all; since Cargo 1.99 an edition-2024 member
# can, but with a single consumer the switch is simplest left here.
locket-agent = { path = "crates/locket-agent", version = "2.1.1", default-features = false }
locket-fido = { path = "crates/locket-fido", version = "2.1.1" }
locket-tpm = { path = "crates/locket-tpm", version = "2.1.1" }

# --- Async / IPC -----------------------------------------------------------
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "process"] }
tokio-stream = "0.1"
futures-util = "0.3"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

# --- Crypto ----------------------------------------------------------------
# HELD BACK DELIBERATELY — do not `cargo upgrade --incompatible` these.
#
# argon2, chacha20poly1305, aes, cbc, hmac, sha2, sha1, hkdf, signature and
# rsa form one RustCrypto generation (aead 0.5 / cipher 0.4 / digest 0.10 /
# signature 2). Newer releases of all of them exist; what holds the block is
# the SSH side, which has no stable release on the new generation as of
# 2026-09-28:
#
#   * ssh-key 0.6.7 (newest stable; 0.7 is still a release candidate)
#     implements `Signer<Signature>` from signature 2. Bumping to signature 3
#     breaks the SSH agent with no forward fix.
#   * rsa 0.9.10 (newest stable; 0.10 is still a release candidate) is the
#     generation ssh-key's own RSA support is built on.
#
# argon2 is no longer a reason on its own — 0.6.0 is stable on digest 0.11 —
# but it moves with the rest. Upgrading anyway compiles nothing: aes 0.9/cbc
# 0.2 drop `encrypt_padded_vec_mut`, and hmac 0.13 moves `new_from_slice` from
# `Mac` to `KeyInit`. Revisit when ssh-key 0.7 and rsa 0.10 are stable, and
# move the whole block together. (The lock already carries the newer
# generation beside this one, through keepass; holding this block is what
# keeps the vault and agent code on the older one.)
#
# These carry exact `=` requirements on purpose: `cargo upgrade` treats a
# pinned requirement as opt-out and skips it even with `--incompatible`
# (`--pinned` defaults to `ignore`), so the set cannot drift apart by accident.
# Everything NOT entangled with digest/signature is kept current — see
# getrandom 0.4 and num-bigint 0.5 below.
argon2 = { version = "=0.5.3", features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "=0.10.1", features = ["alloc"] }
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive", "alloc"] }
subtle = "2.6"
sha2 = "=0.10.9"
sha1 = "=0.10.7"
hmac = "=0.12.1"
hkdf = "=0.12.4"
# Secret Service's `dh-ietf1024-sha256-aes128-cbc-pkcs7` session transport.
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc", "block-padding"] }
num-bigint = "0.5"
base32 = "0.5"
base64ct = { version = "1.8", features = ["alloc"] }
# Password strength estimation for the health report. Pure computation, no
# I/O, so it is allowed into locket-core (behind its `health` feature).
zxcvbn = "3.1"
# The one network client in the workspace, used only by locket-hibp for the
# opt-in Have I Been Pwned range check. rustls so nothing links OpenSSL for
# it; no default features so no cookie jar, no proxy discovery, no surprises.
# `rustls` verifies through rustls-platform-verifier, i.e. against the
# system trust store, so an enterprise or user-added root works here the same
# way it does for every other program on the machine. (0.13.1 also exposed a
# `rustls-native-certs` feature that its code never used; 0.13.5 removed it.)
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
] }

# --- SSH -------------------------------------------------------------------
# Same generation as ssh-key's own `rsa`, so an RSA keypair converts across
# without a second copy of the crate. Held with the block above.
# `sha1`/`sha2` here pull in the OID association those digests need to be
# usable as PKCS#1 v1.5 hashes; SHA-1 is only ever used when a client asks for
# `ssh-rsa` explicitly.
rsa = { version = "=0.9.10", features = ["sha1", "sha2"] }
ssh-key = { version = "=0.6.7", features = ["ed25519", "rsa", "ecdsa", "encryption", "alloc", "std", "getrandom"] }
signature = "=2.2.0"

# --- Serialization / errors / logging --------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
dirs = "7"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Building the COSMIC GUI pulls in iced + wgpu; unoptimised dependency builds
# make the debug binary unusable for real UI work.
[profile.dev.package."*"]
opt-level = 2
