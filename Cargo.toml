[workspace]
resolver = "3"
# Its own workspace: libfuzzer's build flags and lockfile stay out of ours.
exclude = ["fuzz"]
members = [
    "crates/locket-core",
    "crates/locket-hibp",
    "crates/locket-secret",
    "crates/locket-agent",
    "crates/locket-daemon",
    "crates/locket-cli",
    "crates/locket-cosmic",
    "crates/locket-applet",
    "crates/locket-tpm",
    "crates/locket-fido",
    "crates/locket-import",
    "crates/locket-ipc",
    "crates/locket-pam",
    "crates/locket-nmh",
]

[workspace.package]
version = "2.1.1"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/Magnetar-OS/locket"
authors = ["Dominikos Pritis <dominikos.pritis@gmail.com>"]

[workspace.dependencies]
# Every inter-crate dependency lives here, and every one carries a
# `version` next to its `path`. cargo rewrites the path away when packaging
# and publishes the version instead, so a member without one cannot be
# published at all. Declaring them once means the number that goes to
# crates.io is edited in a single place at release time.
locket-core = { path = "crates/locket-core", version = "2.1.1" }
locket-ipc = { path = "crates/locket-ipc", version = "2.1.1" }
locket-hibp = { path = "crates/locket-hibp", version = "2.1.1" }
locket-secret = { path = "crates/locket-secret", version = "2.1.1" }
locket-import = { path = "crates/locket-import", version = "2.1.1" }
# `default-features = false`: locket-daemon is the only consumer and it
# re-exports the `fido` feature under its own name, so the default is off
# here and opted into there. When this was written a member could not turn
# off an inherited default at all; since Cargo 1.99 an edition-2024 member
# can, but with a single consumer the switch is simplest left here.
locket-agent = { path = "crates/locket-agent", version = "2.1.1", default-features = false }
locket-fido = { path = "crates/locket-fido", version = "2.1.1" }
locket-tpm = { path = "crates/locket-tpm", version = "2.1.1" }

# --- Async / IPC -----------------------------------------------------------
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "process"] }
tokio-stream = "0.1"
futures-util = "0.3"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

# --- Crypto ----------------------------------------------------------------
# One RustCrypto generation throughout (digest 0.11 / cipher 0.5 / aead 0.6 /
# signature 3) — the one keepass is on too, so the lock holds a single copy
# of each crate. Stable releases on ordinary caret requirements; the two
# exceptions are in the SSH block below.
argon2 = { version = "0.6", features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive", "alloc"] }
subtle = "2.6"
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
hkdf = "0.13"
# Secret Service's `dh-ietf1024-sha256-aes128-cbc-pkcs7` session transport.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
num-bigint = "0.5"
base32 = "0.5"
base64ct = { version = "1.8", features = ["alloc"] }
# Password strength estimation for the health report. Pure computation, no
# I/O, so it is allowed into locket-core (behind its `health` feature).
zxcvbn = "3.1"
# The one network client in the workspace, used only by locket-hibp for the
# opt-in Have I Been Pwned range check. rustls so nothing links OpenSSL for
# it; no default features so no cookie jar, no proxy discovery, no surprises.
# `rustls` verifies through rustls-platform-verifier, i.e. against the
# system trust store, so an enterprise or user-added root works here the same
# way it does for every other program on the machine. (0.13.1 also exposed a
# `rustls-native-certs` feature that its code never used; 0.13.5 removed it.)
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
] }

# --- SSH -------------------------------------------------------------------
# RELEASE CANDIDATES, PINNED EXACTLY — these two only.
#
# As of 2026-10-06 neither crate has a stable release on this generation:
# ssh-key 0.6.7 (2024-10-15) and rsa 0.9.10 are the newest stable, both on
# the previous one, and staying on them held argon2, chacha20poly1305, aes,
# cbc, hmac, hkdf, sha1, sha2 and signature back with them while the lock
# carried both generations. The block was moved once it resolved as one, the
# agent's tests passed, and vaults and SSH keys had been read both ways
# against the released 2.1.1 on temporary vaults (ssh-key 0.7.0-rc.11 of
# 2026-06-29, rsa 0.10.0-rc.19 of 2026-10-06).
#
# `=` because release candidates promise each other nothing: `cargo update`
# must not carry the tree from one to the next unreviewed, and ssh-key's own
# requirement (`rsa ^0.10.0-rc.18`) would allow it. Raise the two together,
# re-run that check, and drop the `=` when the stable releases exist. (rsa
# brings pkcs1 0.8.0-rc.5 with it; the lock holds that one.)
#
# rsa is here for one operation: the agent's RSA signatures, which are made
# blinded — see locket-agent's `signing`. RUSTSEC-2023-0071 lists every
# version of the crate, these included. Its `sha1`/`sha2` features bring the
# OID association those digests need as PKCS#1 v1.5 hashes; SHA-1 is only
# ever used when a client asks for `ssh-rsa` explicitly.
rsa = { version = "=0.10.0-rc.19", features = ["sha1", "sha2"] }
# `p256`/`p384`/`p521` are what let ssh-key *sign* with an ECDSA key; `ecdsa`
# alone only lets it read one.
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rsa", "ecdsa", "p256", "p384", "p521", "encryption", "alloc", "std", "getrandom"] }
# `rand_core` for `RandomizedSigner`, which is how those signatures are made.
signature = { version = "3", features = ["rand_core"] }

# --- Serialization / errors / logging --------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
dirs = "7"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Building the COSMIC GUI pulls in iced + wgpu; unoptimised dependency builds
# make the debug binary unusable for real UI work.
[profile.dev.package."*"]
opt-level = 2
