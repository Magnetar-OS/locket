[package]
name = "locket-cosmic"
description = "COSMIC desktop frontend for locket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "locket"
path = "src/main.rs"

[features]
# Hardware factors are optional at build time: tss-esapi needs libtss2 and
# ctap-hid-fido2 needs hidapi, and neither is present everywhere. The GUI
# degrades to passphrase-only enrolment without them.
default = ["tpm", "fido"]
tpm = ["dep:locket-tpm"]
fido = ["dep:locket-fido"]

[dependencies]
locket-core.workspace = true
locket-hibp.workspace = true
# Auto-type goes through the RemoteDesktop portal; same ashpd generation
# libcosmic already carries, so this adds no second copy.
ashpd = { version = "0.13", default-features = false, features = [
    "tokio",
    # 0.13 gates each portal behind its own feature; auto-type needs this one.
    # `screencast` comes with it because `remote_desktop` imports that
    # module's `Stream` type without declaring the feature dependency —
    # upstream oversight, not a portal we use.
    "remote_desktop",
    "screencast",
] }
locket-tpm = { path = "../locket-tpm", optional = true }
locket-fido = { path = "../locket-fido", optional = true }
locket-secret.workspace = true
locket-import.workspace = true
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
uuid.workspace = true
dirs.workspace = true

# --- localization ---
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.12"

[dependencies.libcosmic]
# No `rev`: every COSMIC application tracks the default branch and pins the
# exact commit in `Cargo.lock` instead. A `rev` here would also desynchronise
# the tree — libcosmic's own `cosmic-panel-config` and `cosmic-settings-config`
# follow the branch, so a pinned libcosmic makes cargo build two copies of
# `cosmic-config`, `iced_core` and `iced_futures`. Update deliberately with
# `cargo update -p libcosmic`.
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "winit",
    "tokio",
    "a11y",
    "dbus-config",
    "wayland",
    "x11",
    "multi-window",
    "wgpu",
    "about",
    # Only for opening the About page's links; `desktop` would pull in the
    # desktop-entry and settings-config machinery for the same one call.
    "process",
    # Launching locket twice hands off to the running window instead of
    # opening a second one with its own vault handle — which is what the panel
    # applet's "Open locket" would otherwise do on every click.
    "single-instance",
    "xdg-portal",
    "qr_code",
]
# Deliberately absent: `advanced-shaping`. iced already defaults to
# `Shaping::Auto`, which shapes anything non-ASCII the expensive way and leaves
# plain ASCII — most of a vault — on the cheap path. Enabling it only removes
# that second half.


[dev-dependencies]
tempfile = "3"
