[workspace]
resolver = "3"
members = [
    "crates/passman-core",
    "crates/passman-secret",
    "crates/passman-agent",
    "crates/passman-daemon",
    "crates/passman-cli",
    "crates/passman-cosmic",
    "crates/passman-tpm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/idominikos/passman"

[workspace.dependencies]
passman-core = { path = "crates/passman-core" }
passman-secret = { path = "crates/passman-secret" }
passman-agent = { path = "crates/passman-agent" }

# --- Async / IPC -----------------------------------------------------------
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
tokio-stream = "0.1"
futures-util = "0.3"
zbus = { version = "5.18", default-features = false, features = ["tokio"] }

# --- Crypto ----------------------------------------------------------------
# HELD BACK DELIBERATELY — do not `cargo upgrade --incompatible` these.
#
# chacha20poly1305, aes, cbc, hmac, sha2, sha1, hkdf and signature form one
# RustCrypto generation (aead 0.5 / cipher 0.4 / digest 0.10 / signature 2).
# Newer releases of all of them exist, but two crates we depend on have not
# followed and have no newer release as of 2026-08:
#
#   * ssh-key 0.6.7 (newest) implements `Signer<Signature>` from signature 2.
#     Bumping to signature 3 breaks the SSH agent with no forward fix.
#   * argon2 0.5.3 (newest) is built on password-hash 0.5 / digest 0.10.
#     Bumping sha2/hmac to the digest 0.11 line splits the tree.
#
# Upgrading anyway compiles nothing: aes 0.9/cbc 0.2 drop
# `encrypt_padded_vec_mut`, and hmac 0.13 moves `new_from_slice` from `Mac` to
# `KeyInit`. Revisit when ssh-key and argon2 publish against the new
# generation, and move the whole block together.
#
# These carry exact `=` requirements on purpose: `cargo upgrade` treats a
# pinned requirement as opt-out and skips it even with `--incompatible`
# (`--pinned` defaults to `ignore`), so the set cannot drift apart by accident.
# Everything NOT entangled with digest/signature is kept current — see
# getrandom 0.4 and num-bigint 0.5 below.
argon2 = { version = "=0.5.3", features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "=0.10.1", features = ["alloc"] }
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive", "alloc"] }
subtle = "2.6"
sha2 = "=0.10.9"
sha1 = "=0.10.7"
hmac = "=0.12.1"
hkdf = "=0.12.4"
# Secret Service's `dh-ietf1024-sha256-aes128-cbc-pkcs7` session transport.
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc", "block-padding"] }
num-bigint = "0.5"
base32 = "0.5"
base64ct = { version = "1.8", features = ["alloc"] }

# --- SSH -------------------------------------------------------------------
ssh-key = { version = "=0.6.7", features = ["ed25519", "rsa", "ecdsa", "encryption", "alloc", "std", "getrandom"] }
signature = "=2.2.0"
ssh-encoding = "0.3"

# --- Serialization / errors / logging --------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Building the COSMIC GUI pulls in iced + wgpu; unoptimised dependency builds
# make the debug binary unusable for real UI work.
[profile.dev.package."*"]
opt-level = 2
