[package]
name = "locket-applet"
description = "COSMIC panel applet showing locket's lock state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Not publishable: same libcosmic git dependency as locket-cosmic.
# Ships as a distro package.
publish = false

[[bin]]
name = "locket-applet"
path = "src/main.rs"

[dependencies]
locket-secret.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# --- localization ---
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.12"

[dependencies.libcosmic]
# Unpinned for the reasons in `locket-cosmic/Cargo.toml`; `Cargo.lock` holds
# the commit both crates share.
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "applet",
    # Ask the compositor for an XDG activation token before launching the main
    # window. Without one the window comes up unfocused behind the panel, and
    # a running instance cannot be raised at all.
    "applet-token",
    # `spawn_desktop_exec`: double-forks the launch off the panel process and
    # puts it in its own systemd scope, so restarting the panel does not take
    # the vault window down with it.
    "desktop-systemd-scope",
    "tokio",
    "wayland",
    "a11y",
]
