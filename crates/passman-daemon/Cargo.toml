[package]
name = "passman-daemon"
description = "passman session daemon: holds the unlocked vault, serves D-Bus and the SSH agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "passmand"
path = "src/main.rs"

[features]
# Passes through to passman-agent: serve `sk-` SSH keys from a security key.
default = ["fido"]
fido = ["passman-agent/fido"]

[dependencies]
passman-core.workspace = true
passman-secret.workspace = true
passman-agent = { path = "../passman-agent", default-features = false }
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
uuid.workspace = true
clap.workspace = true
dirs.workspace = true
rpassword = "7"
