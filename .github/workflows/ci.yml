# Checks the build and the test suite somewhere other than the author's laptop,
# which until now was the only machine any of this had ever run on.
#
# The tree is rustfmt-clean as of the `style:` commit that reformatted it, so
# `cargo fmt --check` runs here to keep it that way. That commit is listed in
# `.git-blame-ignore-revs` so it does not sit on top of every blame.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A build that has to go and fetch a git dependency should say so loudly
  # rather than quietly using whatever moved under it.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # Everything that does not need a graphical stack: the vault, the crypto, the
  # Secret Service, the agent, the importers, PAM. This is where the tests are.
  test:
    name: Test (no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libtss2-dev libudev-dev libssl-dev libpam0g-dev
      # No toolchain action: rustup is preinstalled on the runner and reads
      # `rust-toolchain.toml` itself, so the version and its components are
      # named in one place instead of drifting apart from CI.
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --exclude locket-cosmic --exclude locket-applet
      - name: Test
        run: cargo test --workspace --exclude locket-cosmic --exclude locket-applet
      - name: Clippy
        run: cargo clippy --workspace --exclude locket-cosmic --exclude locket-applet --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --check

  # The GUI and the panel applet pull in libcosmic, and with it wayland, xkb and
  # a font stack. Built but not tested: the tests there drive state machines,
  # and they run in the job above's scope only when a display stack is present.
  gui:
    name: Build (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libtss2-dev libudev-dev libssl-dev \
            libxkbcommon-dev libwayland-dev libfontconfig-1-dev
      # Toolchain comes from rust-toolchain.toml, as above.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p locket-cosmic -p locket-applet
      - run: cargo test -p locket-cosmic -p locket-applet

  # A bounded pass over the fuzz targets: sixty seconds each over the four
  # places untrusted bytes enter (vault file, agent wire, session transport,
  # importers). Not a soak — that runs longer and elsewhere — but enough to
  # catch a parser regression the day it lands, and to keep the targets
  # themselves compiling.
  fuzz:
    name: Fuzz (bounded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libtss2-dev libudev-dev libssl-dev
      - name: Nightly toolchain for libfuzzer
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each target for a minute
        working-directory: fuzz
        run: |
          for target in vault_file agent_wire secret_session totp dotenv; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -timeout=10
          done

  # Cheap checks that catch the things nobody notices until a packager does.
  packaging:
    name: Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils shellcheck
      - name: AppStream metainfo
        # --no-net because the URLs it wants to reach are this repository, which
        # a fork or a pre-publication branch will not have.
        run: appstreamcli validate --no-net res/com.magnetaros.Locket.metainfo.xml
      - name: Desktop entries
        run: desktop-file-validate res/*.desktop
      - name: Installer script
        run: shellcheck -S warning scripts/locket-setup scripts/locket-reimport-keyring
