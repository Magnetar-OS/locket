[package]
name = "locket-import"
description = "Importers for browser CSV exports, .env trees, SSH keys, cloud CLI credentials, authenticator exports, pass and KeePass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["import", "keepass", "bitwarden", "password", "migration"]
categories = ["parser-implementations", "authentication"]
readme = "README.md"

[dependencies]
locket-core.workspace = true
uuid.workspace = true
dirs.workspace = true
base64ct.workspace = true
serde.workspace = true
serde_json.workspace = true
# Held at `=`: 0.13.25 declares an aes range wide enough to unify with the
# workspace's pinned aes 0.8 while its own cbc/cipher sit on the 0.5
# generation, and the mix does not compile. 0.13.22 resolves cleanly.
# Revisit together with the crypto block in the workspace Cargo.toml.
keepass = { version = "=0.13.22", features = ["save_kdbx4"] }
# 1Password's .1pux and Proton Pass's export are both zip envelopes around
# JSON. Deflate only — that is what both exporters write.
zip = { version = "8", default-features = false, features = ["deflate"] }
csv = "1"
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
