[package]
name = "passman-applet"
description = "COSMIC panel applet showing passman's lock state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "passman-applet"
path = "src/main.rs"

[dependencies]
passman-secret.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "43a50cb6f5af18fa6cbea535fb46460a3c5cd573"
default-features = false
features = [
    "applet",
    # Ask the compositor for an XDG activation token before launching the main
    # window. Without one the window comes up unfocused behind the panel, and
    # a running instance cannot be raised at all.
    "applet-token",
    # `spawn_desktop_exec`: double-forks the launch off the panel process and
    # puts it in its own systemd scope, so restarting the panel does not take
    # the vault window down with it.
    "desktop-systemd-scope",
    "tokio",
    "wayland",
    "a11y",
]
