[package]
name = "locket-secret"
description = "org.freedesktop.secrets client/server and XDG Secret portal integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["secret-service", "dbus", "keyring", "freedesktop", "libsecret"]
categories = ["os::linux-apis", "authentication"]
readme = "README.md"

[dependencies]
locket-core.workspace = true
locket-ipc.workspace = true
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
aes.workspace = true
cbc.workspace = true
num-bigint.workspace = true
chacha20poly1305.workspace = true
uuid.workspace = true
tempfile = { version = "3", optional = true }

[features]
# A private `dbus-daemon` and a daemon's objects served on it, for tests that
# have to cross a real bus: see `src/testing.rs`. Never enabled by a build
# that ships.
test-bus = ["dep:tempfile"]

[dev-dependencies]
# Enables `test-bus` for this crate's own tests.
locket-secret = { path = ".", features = ["test-bus"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
