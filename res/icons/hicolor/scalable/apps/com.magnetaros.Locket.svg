<?xml version="1.0" encoding="UTF-8"?>
<!--
  locket application icon.

  A keyhole, because at 24 pixels that is the one shape nobody has to think
  about. Drawn from primitives rather than exported from an editor so it stays
  small, diffable, and crisp at every size the icon theme asks for.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4a63"/>
      <stop offset="1" stop-color="#212836"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#e8a33d"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square base, the shape COSMIC and Adwaita app icons share. -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#body)"/>
  <!-- A single highlight along the top edge reads as depth without a bevel. -->
  <path d="M34 8h60a26 26 0 0 1 26 26v4a26 26 0 0 0-26-26H34A26 26 0 0 0 8 38v-4A26 26 0 0 1 34 8z"
        fill="#ffffff" opacity="0.14"/>

  <!-- The keyhole: circle plus a tapered stem, as one path so it scales as a
       unit and never shows a seam between the two halves. -->
  <path d="M64 34a21 21 0 0 0-9.6 39.7L48 96h32l-6.4-22.3A21 21 0 0 0 64 34z"
        fill="url(#brass)"/>
  <circle cx="64" cy="55" r="8.5" fill="#212836" opacity="0.55"/>
</svg>
