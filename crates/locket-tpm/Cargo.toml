[package]
name = "locket-tpm"
description = "TPM 2.0 sealed key slots for locket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["tpm", "tpm2", "sealing", "key-slot"]
categories = ["cryptography", "os::linux-apis"]
readme = "README.md"

[dependencies]
locket-core.workspace = true
tss-esapi = "7.7"
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
getrandom.workspace = true
base64ct.workspace = true
uuid.workspace = true

tempfile = { version = "3", optional = true }

[features]
# An `swtpm` started per test: see `src/testing.rs`. Never enabled by a build
# that ships.
test-swtpm = ["dep:tempfile"]

[dev-dependencies]
# Enables `test-swtpm` for this crate's own tests.
locket-tpm = { path = ".", features = ["test-swtpm"] }
tempfile = "3"
